# Alternative to the Quadlet unit: podman-compose -f deploy/compose.yaml up -d
services:
  mediatimeline:
    image: ghcr.io/dertika/mediatimeline:latest
    # Fixed version: :1.0.1 (exact) or :1.0 (stays on 1.0, still gets the fixes)
    # `podman-compose build` builds the image locally instead
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: mediatimeline
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../config.yaml:/config/config.yaml:ro,Z
      # :U (Podman only) gives the volume to the container user (uid 1000).
      # Docker ignores it: with a bind mount instead of the named volume, run
      # `sudo chown -R 1000:1000 <dir>` or set `user:` to the dir's uid:gid
      # (see README, "Docker und Bind Mounts").
      - mediatimeline-data:/data:U,Z
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s

volumes:
  mediatimeline-data:
