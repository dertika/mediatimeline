# nginx in front of mediatimeline with Authelia forward auth for the admin UI.
# Adjust: server_name, certificates, the Authelia address and the upstream.
# Based on https://www.authelia.com/integration/proxies/nginx/
# Copy mediatimeline-proxy.conf to /etc/nginx/snippets/ (it is included per
# location because proxy_set_header inside a location drops inherited ones).

upstream mediatimeline {
    server 127.0.0.1:8080;
}

# Optional cache for thumbnails and previews (see the location below and the
# README). Create the directory and let nginx own it, or drop both parts.
proxy_cache_path /var/cache/nginx/mediatimeline levels=1:2 keys_zone=mediatimeline_media:10m
                 max_size=2g inactive=7d use_temp_path=off;

# Responses of password-protected links are "private": never store those.
map $upstream_http_cache_control $mediatimeline_no_cache {
    ~*private 1;
    default   0;
}

server {
    listen 443 ssl;
    http2 on;
    server_name timeline.example.com;

    ssl_certificate     /etc/letsencrypt/live/timeline.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timeline.example.com/privkey.pem;

    client_max_body_size 1m;

    # ---- Authelia authz endpoint (internal only) ----
    location = /internal/authelia/authz {
        internal;
        proxy_pass http://127.0.0.1:9091/api/authz/auth-request;

        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL    $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header Content-Length    "";
        proxy_set_header Connection        "";
        proxy_pass_request_body off;
    }

    # ---- Admin UI: redirect to the Authelia login when not signed in ----
    location /admin {
        auth_request /internal/authelia/authz;
        auth_request_set $user   $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $redirection_url $upstream_http_location;
        error_page 401 =302 $redirection_url;

        proxy_set_header Remote-User   $user;
        proxy_set_header Remote-Groups $groups;
        include snippets/mediatimeline-proxy.conf;
        proxy_pass http://mediatimeline;
    }

    # ---- Admin API: plain 401 so the SPA can react ----
    location /api/admin/ {
        auth_request /internal/authelia/authz;
        auth_request_set $user   $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;

        proxy_set_header Remote-User   $user;
        proxy_set_header Remote-Groups $groups;
        include snippets/mediatimeline-proxy.conf;
        proxy_pass http://mediatimeline;
    }

    # ---- Thumbnails and previews of public links, cached by nginx ----
    # Kept 10 minutes regardless of the browser's max-age, so revoking a link
    # or adding a password takes effect for cached images within that time.
    location ~ ^/api/public/timeline/[^/]+/assets/[^/]+/(thumbnail|preview)$ {
        proxy_set_header Remote-User   "";
        proxy_set_header Remote-Groups "";

        proxy_cache mediatimeline_media;
        proxy_cache_key $uri;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 10m;
        proxy_no_cache $mediatimeline_no_cache;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;

        include snippets/mediatimeline-proxy.conf;
        proxy_pass http://mediatimeline;
    }

    # ---- Everything else is public (timelines, media, assets) ----
    location / {
        # Never pass client-supplied identity headers through.
        proxy_set_header Remote-User   "";
        proxy_set_header Remote-Groups "";

        # Video seeking needs Range requests passed through unbuffered.
        proxy_buffering off;
        include snippets/mediatimeline-proxy.conf;
        proxy_pass http://mediatimeline;
    }
}

# Authelia configuration.yml (excerpt):
#
# access_control:
#   default_policy: deny
#   rules:
#     - domain: timeline.example.com
#       resources: ['^/admin([/?].*)?$', '^/api/admin/.*$']
#       policy: two_factor
#       subject: ['group:admins']
#     - domain: timeline.example.com
#       policy: bypass
