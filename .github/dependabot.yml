# Weekly check for new versions. Minor and patch updates of one ecosystem
# arrive as a single pull request, major updates one by one.
version: 2
updates:
  # backend and frontend are npm workspaces with one lockfile in the root, so
  # Dependabot has to look at the root: only there it updates the lockfile too
  # (per workspace folder its pull requests left npm ci failing).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # Big jumps are done by hand on purpose:
    # - @types/node has to follow the Node version in deploy/Dockerfile.
    # - TypeScript 7 needs one shared lockfile change for backend and frontend.
    # - SvelteKit 3 and adapter-static 4 belong together and are switched together.
    # - cookie 2 is a major rewrite that has to be checked first.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/adapter-static"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/kit"
        update-types: ["version-update:semver-major"]
      - dependency-name: cookie
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # The base image (node:22-alpine) in deploy/Dockerfile. A new Node major
  # is switched by hand after the app has run on it (node:sqlite, argon2).
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: library/node
        update-types: ["version-update:semver-major"]
